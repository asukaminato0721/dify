[project]
name = "dify-api-fastapi"
version = "0.1.0"
description = "FastAPI-based port of the Dify backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiomysql~=0.2.0",
    "alembic~=1.16.5",
    "asyncpg~=0.30.0",
    "fastapi~=0.116.1",
    "gmpy2~=2.3.0",
    "httpx~=0.28.1",
    "itsdangerous~=2.2.0",
    "jsonschema~=4.26.0",
    "markdown~=3.10.2",
    "numpy~=2.4.4",
    "opentelemetry-api==1.41.0",
    "packaging~=26.0",
    "bleach~=6.3.0",
    "cachetools~=7.0.5",
    "celery~=5.6.3",
    "deprecated~=1.2.18",
    "pydantic~=2.12.5",
    "pydantic-extra-types~=2.10.6",
    "pydantic-settings~=2.13.1",
    "orjson~=3.11.4",
    "pycryptodome==3.23.0",
    "pyjwt~=2.12.1",
    "pytz~=2025.2",
    "python-multipart~=0.0.20",
    "python-dotenv==1.2.2",
    "pyyaml~=6.0.1",
    "redis[hiredis]~=7.4.0",
    "sqlalchemy[asyncio]~=2.0.49",
    "tenacity~=9.1.2",
    "uvicorn[standard]~=0.35.0",
    "yarl~=1.23.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=8.4.2",
    "pytest-asyncio~=0.24.0",
    "pyrefly>=0.61.0",
    "ruff~=0.15.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
